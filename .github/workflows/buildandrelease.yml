name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'

# Read-only by default; jobs request only the extra permissions they need
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub Release
      pull-requests: read   # read PR labels for the changelog
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Get previous tag version
        id: get_previous_version
        run: echo "PREVIOUSVERSION=$(git describe --tags --abbrev=0 ${{ steps.get_version.outputs.VERSION }}^ 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
      - name: Print the version
        run: |
            echo "Current tag version is ${{ steps.get_version.outputs.VERSION }}"
            echo "Previous tag version is ${{ steps.get_previous_version.outputs.PREVIOUSVERSION }}"
      - name: Verify tag matches module version
        shell: pwsh
        run: |
          $moduleVersion = (Import-PowerShellDataFile -Path ./PSCloudPc/PSCloudPC.psd1).ModuleVersion
          $tagVersion = '${{ steps.get_version.outputs.VERSION }}'.TrimStart('v')
          if ($moduleVersion -ne $tagVersion) {
            throw "Tag version '$tagVersion' does not match ModuleVersion '$moduleVersion' in PSCloudPC.psd1"
          }
          Write-Host "Tag version matches ModuleVersion $moduleVersion"
      - name: "Build release changelog"
        id: build_release_changelog
        uses: mikepenz/release-changelog-builder-action@cb021f9b36a51a7c6f18e4679b6fa2cb77a1260c # v6.3.0
        with:
            fromTag: ${{ steps.get_previous_version.outputs.PREVIOUSVERSION }}
            toTag: ${{ steps.get_version.outputs.VERSION }}
            configurationJson: |
                {
                "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Uncategorized</summary>\n\n#{{UNCATEGORIZED}}\n</details>",
                "categories": [
                    {
                        "title": "## ❗️ Breaking!!!",
                        "labels": ["breaking"]
                    },
                    {
                        "title": "## 🚀 Features",
                        "labels": ["feature"]
                    },
                    {
                        "title": "## 🐛 Fixes",
                        "labels": ["bug"]
                    },
                    {
                        "title": "## 📝 Refactor",
                        "labels": ["refactor"]
                    },
                    {
                        "title": "## 📄 Documentation",
                        "labels": ["documentation"]
                    },
                    {
                        "title": "## 🧪 Tests",
                        "labels": ["test"]
                    },
                    {
                        "title": "## 💬 Other",
                        "labels": ["other"]
                    },
                    {
                        "title": "## 📦 Dependencies",
                        "labels": ["dependencies"]
                    }
                ]
                }
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          body: ${{ steps.build_release_changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to PowerShell Gallery
    needs: build
    runs-on: ubuntu-latest
    # PS_GALLERY_KEY lives in this environment; each publish waits for a reviewer's approval
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publishing module to PowerShell Gallery
        shell: pwsh
        env:
          PS_GALLERY_KEY: ${{ secrets.PS_GALLERY_KEY }}
        run: |
          ./Publish/PublishPSGallery.ps1 -PS_GALLERY_KEY $env:PS_GALLERY_KEY
