name: Feature Request
description: Suggest a new cmdlet or an improvement to PSCloudPC
title: "🚀 [Feature Request]: "
labels: [feature]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature! Please search the [existing issues](https://github.com/Windows365Management/PSCloudPC/issues) first to check whether it has already been requested.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing or hard today?
      placeholder: ex. I want to see which Cloud PCs have not been used for 30 days, but...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the cmdlet or change you would like, including example usage and expected output.
      placeholder: |
        Get-CPCUsage -InactiveDays 30
    validations:
      required: true
  - type: input
    id: graph-api
    attributes:
      label: Microsoft Graph API reference
      description: A link to the Microsoft Graph documentation for the endpoint, if you know it.
      placeholder: https://learn.microsoft.com/graph/api/...
  - type: textarea
    id: implementation
    attributes:
      label: Possible implementation
      description: Optional. Any ideas on how to implement it.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this and open a pull request
