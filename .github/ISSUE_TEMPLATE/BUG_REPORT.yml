name: Bug Report
description: Report something in PSCloudPC that is not working as expected
title: "🪲[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search the [existing issues](https://github.com/Windows365Management/PSCloudPC/issues) first to check whether it has already been reported.

        > ⚠️ This issue is public. Remove tenant IDs, access tokens, client secrets and other sensitive information from commands and output before posting. To report a security vulnerability, follow the [security policy](https://github.com/Windows365Management/PSCloudPC/blob/main/SECURITY.md) instead.
  - type: input
    id: cmdlet
    attributes:
      label: Cmdlet
      description: Which cmdlet is affected?
      placeholder: ex. Get-CloudPC
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what happened and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, including parameters.
      render: powershell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message and verbose output
      description: Run the command again with `-Verbose` and paste the output and the full error message.
      render: shell
  - type: input
    id: module-version
    attributes:
      label: PSCloudPC version
      description: Output of `(Get-Module PSCloudPC).Version`
      placeholder: ex. 1.0.17
    validations:
      required: true
  - type: input
    id: ps-version
    attributes:
      label: PowerShell version
      description: Output of `$PSVersionTable.PSVersion`
      placeholder: ex. 7.4.6
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Authentication method
      options:
        - Interactive
        - Device code
        - Client secret
        - Client certificate
        - Access token
    validations:
      required: true
